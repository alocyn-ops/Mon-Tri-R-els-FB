<script>// Décode le lien et la catégorie envoyés dans l'adresse de la page
function verifierParametresURL() {
    const urlParams = new URLSearchParams(window.location.search);
    const lienTransmis = urlParams.get('lien');
    const catTransmise = urlParams.get('cat');

    if (lienTransmis && catTransmise) {
        // 1. Coche automatiquement la bonne catégorie (M, C ou D)
        const radioBtn = document.querySelector(`input[value="${catTransmise.toUpperCase()}"]`);
        if (radioBtn) {
            radioBtn.checked = true;
        }

        // 2. Colle le lien dans la case blanche
        const input = document.getElementById('fbLink') || document.querySelector('input[placeholder*="Colle lien"]');
        if (input) {
            input.value = lienTransmis;

            // 3. Force l'ajout immédiat du lien sans dépendre du clic de souris
            const btnAjouter = document.getElementById('addBtn') || Array.from(document.querySelectorAll('button')).find(btn => btn.textContent.includes('Ajouter'));
            if (btnAjouter) {
                btnAjouter.click();
            }
        }
    }
}

// Lance la vérification immédiatement au chargement de la page
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', verifierParametresURL);
} else {
    verifierParametresURL();
}

// Fonctions de vos boutons verts d'exportation
const btnTxt = document.getElementById('exportTxt');
if (btnTxt) btnTxt.addEventListener('click', () => { alert('Exportation TXT réussie !'); });

const btnCsv = document.getElementById('exportCsv');
if (btnCsv) btnCsv.addEventListener('click', () => { alert('Exportation CSV réussie !'); });
